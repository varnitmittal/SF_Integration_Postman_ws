$kind: http-request
description: Delete a credential.
url: "{{_endpoint}}/services/data/v{{version}}/named-credentials/credential"
method: DELETE
body:
  type: json
  content: |-
    {
        "externalCredential": "SampleExternalCredential",
        "principalType": "NamedPrincipal",
        "principalName": "SamplePrincipal"
    }
order: 12000
