$kind: graphql-request
url: "{{_endpoint}}/services/data/v{{version}}/graphql"
query: |-
  query opportunitiesClosed {
    uiapi {
      query {
        Opportunity(
          where: {
            or: [
              { StageName: { eq: "Prospecting" } }
              { StageName: { eq: "Needs Analysis" } }
            ]
          }
        ) {
          edges {
            node {
              Id
              Name {
                value
              }
              CloseDate {
                value
                displayValue
              }
              Description {
                value
              }
              StageName {
                value
              }
            }
          }
        }
      }
    }
  }
headers:
  X-Chatter-Entity-Encoding: "false"
examples: ./.resources/Opportunities Early Stage.resources/examples
order: 10000
