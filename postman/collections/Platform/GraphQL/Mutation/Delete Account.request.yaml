$kind: graphql-request
url: "{{_endpoint}}/services/data/v{{version}}/graphql"
query: |-
  mutation AccountDeleteExample{
    uiapi {
      AccountDelete(input: {
        Id: "<Id>"
      })
        {
           Id
        }
    }
  }
headers:
  X-Chatter-Entity-Encoding: "false"
examples: ./.resources/Delete Account.resources/examples
order: 2000
