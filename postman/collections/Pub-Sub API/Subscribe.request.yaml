$kind: grpc-request
url: "{{pubSubApiEndpoint}}"
methodPath: eventbus.v1.PubSub.Subscribe
methodDescriptor: 
message:
  content: |-
    {
        "num_requested": 1,
        "topic_name": "{{topicName}}"
    }
metadata:
  - key: accesstoken
    value: "{{accessToken}}"
    description: Access token for the Salesforce Org
  - key: instanceurl
    value: "{{instanceUrl}}"
    description: Salesforce Org instance URL
  - key: tenantid
    value: "{{orgId}}"
    description: Salesforce Org ID
settings:
  secureConnection: true
auth:
  type: noauth
schema:
  source: api
  apiId: 13095926-87da-4278-b8fd-eb7f9a1466b2
  versionId: f7e2312a-abe9-4bca-a776-ca6469ff9fef
scripts:
  - type: beforeInvoke
    code: |
      const topicName = pm.collectionVariables.get("topicName");
      console.info(`gRPC Stream started with topic ${topicName}`);
    language: text/javascript
  - type: afterResponse
    code: console.info("gRPC Stream closed");
    language: text/javascript
  - type: onIncomingMessage
    code: |
      // Load avro from NPM
      const avroJs = pm.require('npm:avro-js@1.12.0');

      // Fetch the schema from the global var and parse it with avro
      const schemaJsonStr = pm.globals.get("_schemaJson");
      if (!schemaJsonStr) {
          throw new Error('Failed to load schema. Call the Get Schema operation before running this operation.');
      }
      const schemaJson = JSON.parse(schemaJsonStr);
      const avroSchema = avroJs.parse(schemaJson);

      function readPayload(input, avroSchema) {
          // Decode base 64 string
          const binaryString = atob(input);
          const uint8Array = new Uint8Array(binaryString.length);
          for (let i = 0; i < binaryString.length; i++) {
              uint8Array[i] = binaryString.charCodeAt(i);
          }
          const decodedInput = Buffer.from(uint8Array);
          // Parse payload with Avro schema
          const payload = avroSchema.fromBuffer(decodedInput);
          return payload;
      }

      function readReplayId(input) {
          const binaryString = atob(input);
          const uint8Array = new Uint8Array(binaryString.length);
          for (let i = 0; i < binaryString.length; i++) {
              uint8Array[i] = binaryString.charCodeAt(i);
          }
          const dataView = new DataView(uint8Array.buffer, uint8Array.byteOffset + 0, 8);
          const decodedReplayId = dataView.getBigUint64(0, false);
          return decodedReplayId;
      }


      // Loop over every event received
      pm.message.data.events.forEach(event => {
          // Read payload
          const payload = readPayload(event.event.payload, avroSchema);
          // Read event replay ID
          const eventReplayId = readReplayId(event.replay_id);
          // Print out the event
          console.info(`<<== Received event with replay ID ${eventReplayId} and correlation key ${event.event.id}`);
          console.info('Received event: ', payload);
      });
    language: text/javascript
    packages:
      npm:avro-js@1~DOT~12~DOT~0:
        id: npm:avro-js@1.12.0
examples: ./.resources/Subscribe.resources/examples
order: 3000
