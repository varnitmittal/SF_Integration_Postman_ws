$kind: grpc-request
url: "{{pubSubApiEndpoint}}"
methodPath: eventbus.v1.PubSub.GetTopic
methodDescriptor: 
message:
  content: |-
    {
        "topic_name": "{{topicName}}"
    }
metadata:
  - key: accesstoken
    value: "{{accessToken}}"
    description: Access token for the Salesforce Org
  - key: instanceurl
    value: "{{instanceUrl}}"
    description: Salesforce Org instance URL
  - key: tenantid
    value: "{{orgId}}"
    description: Salesforce Org ID
settings:
  secureConnection: true
auth:
  type: noauth
schema:
  source: api
  apiId: 13095926-87da-4278-b8fd-eb7f9a1466b2
  versionId: f7e2312a-abe9-4bca-a776-ca6469ff9fef
scripts:
  - type: afterResponse
    code: |-
      // Validate that correct env vars are set
      pm.test('_schemaId global var should exist', () => {
          pm.expect(pm.globals.has('_schemaId')).to.equal(true);
      });

      pm.test('tenantGUID global var should exist', () => {
          pm.expect(pm.globals.has('_tenantGUID')).to.equal(true);
      });
    language: text/javascript
  - type: onIncomingMessage
    code: |-
      // Fetch the message data
      var jsonResponse = pm.message.data;

      // Set the schema and tenant ids in env variables for other grpc calls
      pm.globals.set("_schemaId", jsonResponse["schema_id"]);
      pm.globals.set("_tenantGUID", jsonResponse["tenant_guid"]);
    language: text/javascript
examples: ./.resources/Get topic.resources/examples
order: 1000
