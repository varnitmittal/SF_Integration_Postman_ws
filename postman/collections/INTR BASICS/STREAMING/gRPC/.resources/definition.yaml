  # gRPC Pub/Sub API in Salesforce

  ## What it is

  Salesforce Pub/Sub API is a modern real-time event streaming API built on:

  - gRPC
      
  - HTTP/2
      
  - Protocol Buffers (protobuf)
      

  It is used for:

  - Platform Events
      
  - Change Data Capture (CDC)
      
  - high-scale event streaming
      

  ---

  # Basic Flow

  ``` text
  Subscribe Request
      ↓
  Live gRPC Stream
      ↓
  Receive Events
      ↓
  Decode Avro Payload using Schema

   ```

  ---

  # Main Components

  | Component | Purpose |
  | --- | --- |
  | Subscribe | Listen to events |
  | Publish | Send Platform Events |
  | GetSchema | Fetch Avro schema |
  | Replay ID | Resume missed events |
  | Payload | Binary Avro event data |

  ---

  # Topic Formats

  ## Platform Events

  ``` text
  /event/EventName__e

   ```

  ## CDC

  ``` text
  /data/ObjectChangeEvent

   ```

  Example:

  ``` text
  /data/AccountChangeEvent

   ```

  ---

  # Why gRPC instead of CometD?

  ## CometD (Older Streaming API)

  Uses:

  - Bayeux protocol
      
  - long polling / HTTP
      
  - JSON messages
      

  Good for:

  - simple browser streaming
      
  - lightweight integrations
      

  ---

  ## gRPC Pub/Sub API (Modern)

  Uses:

  - HTTP/2 streaming
      
  - protobuf
      
  - binary Avro payloads
      

  Designed for:

  - enterprise-scale streaming
      
  - high throughput
      
  - low latency
      
  - backend systems
      

  ---

  # Key Advantages over CometD

  | Feature | CometD | Pub/Sub API |
  | --- | --- | --- |
  | Protocol | Bayeux | gRPC |
  | Transport | Long polling | HTTP/2 streams |
  | Payload | JSON | Binary Avro |
  | Performance | Moderate | High |
  | Scalability | Lower | Higher |
  | Replay handling | Basic | Better |
  | Efficiency | Lower | Higher |
  | Enterprise streaming | Limited | Strong |

  ---

  # Why payloads are binary

  Salesforce uses:

  ``` text
  Avro serialization

   ```

  because:

  - smaller payload size
      
  - faster transport
      
  - schema-based contracts
      
  - better streaming efficiency
      

  ---

  # Real Enterprise Use Cases

  - Kafka pipelines
      
  - Data lake ingestion
      
  - ERP synchronization
      
  - Real-time analytics
      
  - Event-driven microservices
      
  - High-volume integrations
      

  ---

  # Core Difference

  ## CometD

  ``` text
  human-friendly streaming

   ```

  ## Pub/Sub API

  ``` text
  machine-optimized enterprise streaming

   ```

  That is the architectural shift.

