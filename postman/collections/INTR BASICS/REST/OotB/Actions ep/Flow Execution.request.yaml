      \    public static List<String> generateMessage(List<Request> requests) {\r

      \r

      \        List<String> responses =\r

      \            new List<String>();\r

      \r

      \        for(Request req : requests) {\r

      \r

      \            responses.add('Welcome ' + req.studentName + ' to Salesforce REST APIs!');\r

      \        }\r

      \r

      \        return responses;\r

      \    }\r

      }\r

      */"
