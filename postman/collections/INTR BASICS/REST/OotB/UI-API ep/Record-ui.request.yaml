  # Salesforce REST API — UI API Record UI

  Endpoint:

  ``` http
  GET /services/data/v64.0/ui-api/record-ui/{RecordId}

   ```

  Purpose:  
  Returns:

  - record data
      
  - layout structure
      
  - editable fields
      
  - required fields
      
  - UI metadata
      

  in ONE response.

  ---

  # Simple Difference

  ## records API

  ``` text
  gives record data

   ```

  Example:

  - Name
      
  - Email
      
  - Class
      

  ---

  ## record-ui API

  ``` text
  gives record data + how page should look

   ```

  Example:

  - which section field belongs to
      
  - editable?
      
  - required?
      
  - visible?
      
  - layout order
      

  ---

  # Postman Example

  ``` http
  GET
  {{RootUrl}}/services/data/v64.0/ui-api/record-ui/a1hgK000002LFR7QAO?layoutTypes=Full&modes=View

   ```

  Headers:

  ``` http
  Authorization: Bearer ACCESS_TOKEN

   ```

  ---

  # Important Query Params

  ## layoutTypes

  ``` text
  Compact
  Full

   ```

  Controls:

  ``` text
  which layout Salesforce returns

   ```

  ---

  ## modes

  ``` text
  View
  Edit
  Create

   ```

  Controls:

  ``` text
  how UI should behave

   ```

  ---

  # Real Use Case

  Lightning Record Page needs:

  - field values
      
  - layout sections
      
  - editability
      
  - required fields
      

  Record UI provides all together.

  ---

  # Important Concept

  Record UI is:

  ``` text
  frontend page-rendering API

   ```

  Very heavily used internally by Lightning Experience.

