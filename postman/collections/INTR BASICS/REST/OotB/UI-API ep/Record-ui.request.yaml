  # PARAMS

  For:

  ``` http
  /ui-api/record-ui/{RecordId}

   ```

  these are the most important query params to know.

  ---

  # 1\. layoutTypes

  Controls:

  ``` text
  which layout Salesforce returns

   ```

  Examples:

  ``` text
  Full
  Compact

   ```

  Example:

  ``` http
  ?layoutTypes=Full

   ```

  ---

  # 2\. modes

  Controls:

  ``` text
  UI behavior mode

   ```

  Examples:

  ``` text
  View
  Edit
  Create

   ```

  Example:

  ``` http
  ?modes=Edit

   ```

  Very important because:

  - required fields can change
      
  - editable fields can change
      
  - layouts can change
      

  ---

  # 3\. optionalFields

  Adds extra fields beyond layout.

  Example:

  ``` http
  &optionalFields=Student__c.Email__c

   ```

  Useful when:

  ``` text
  frontend needs additional hidden data

   ```

  without modifying layouts.

  ---

  # 4\. formFactor

  Controls:

  ``` text
  device-specific layout

   ```

  Examples:

  ``` text
  Large
  Medium
  Small

   ```

  Meaning:

  - Desktop
      
  - Tablet
      
  - Mobile
      

  Example:

  ``` http
  &formFactor=Small

   ```

  Lightning mobile heavily uses this.

  ---

  # 5\. recordIds

  Can retrieve:

  ``` text
  multiple records

   ```

  Example:

  ``` http
  ?recordIds=a1hXXX,a1hYYY

   ```

  ---

  # Most Important Real Combination

  ``` http
  {{RootUrl}}/services/data/v64.0/ui-api/record-ui/a1hgK000002LFR7QAO?layoutTypes=Full&modes=Edit&formFactor=Large

   ```

  This means:

  ``` text
  Give me desktop edit-page metadata for this record

   ```

  Very close to what Lightning internally needs.
