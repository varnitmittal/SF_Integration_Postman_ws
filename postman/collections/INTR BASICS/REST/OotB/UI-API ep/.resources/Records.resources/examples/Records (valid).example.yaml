$kind: http-example
description: |-
  # Salesforce REST API — UI API Records

  UI API Records provides frontend-aware record retrieval.

  Endpoint:

  ``` http
  GET /services/data/v64.0/ui-api/records/{RecordId}

   ```

  Example:

  ``` http
  GET /services/data/v64.0/ui-api/records/a1hgK000002LFR7QAO

   ```

  ---

  # Purpose

  - retrieve UI-aware record data
      
  - support frontend rendering
      
  - provide formatted display values
      
  - respect user permissions
      
  - support Lightning Experience and LWC
      

  ---

  # Postman Request

  Method:

  ``` http
  GET

   ```

  URL:

  ``` http
  {{RootUrl}}/services/data/v64.0/ui-api/records/a1hgK000002LFR7QAO?fields=Student__c.Student_Name__c,Student__c.Email__c

   ```

  Headers:

  ``` http
  Authorization: Bearer ACCESS_TOKEN

   ```

  ---

  # Important Query Parameter

  ## fields

  Specifies fields to retrieve.

  Example:

  ``` http
  ?fields=Student__c.Student_Name__c,Student__c.Email__c

   ```

  Required because UI API is optimized for:

  ``` text
  frontend field-level retrieval

   ```

  instead of full raw records.

  ---

  # What It Returns

  Example Response:

  ``` json
  {
    "fields": {
      "Student_Name__c": {
        "displayValue": null,
        "value": "Alex Smith"
      },
      "Email__c": {
        "displayValue": null,
        "value": "alex@test.com"
      }
    }
  }

   ```

  ---

  # Important Concepts

  ## value

  ``` json
  "value"

   ```

  Raw database value.

  Example:

  ``` text
  Alex Smith

   ```

  ---

  ## displayValue

  ``` json
  "displayValue"

   ```

  Frontend-rendered value.

  Used for:

  - dates
      
  - currency
      
  - lookups
      
  - formatted fields
      
  - picklists
      

  ---

  # Example

  Database value:

  ``` text
  2026-05-19T00:00:00.000Z

   ```

  displayValue:

  ``` text
  May 19, 2026

   ```

  Frontend-ready formatting.

  ---

  # Important Difference from sObjects API

  sObjects API:

  ``` http
  /sobjects/Student__c/{Id}

   ```

  Purpose:

  ``` text
  database-centric retrieval

   ```

  UI API Records:

  ``` http
  /ui-api/records/{Id}

   ```

  Purpose:

  ``` text
  frontend-aware retrieval

   ```

  ---

  # Key Differences

  | Feature | sObjects API | UI API Records |
  | --- | --- | --- |
  | Raw values | ✅ | ✅ |
  | displayValue | ❌ | ✅ |
  | UI-aware | ❌ | ✅ |
  | Frontend optimized | ❌ | ✅ |
  | Permissions-aware | Limited | ✅ |
  | Formatting support | ❌ | ✅ |

  ---

  # User Context Awareness

  UI API executes in context of authenticated user.

  Response respects:

  - field-level security
      
  - permissions
      
  - visibility
      
  - editability
      

  Different users can receive different responses.

  ---

  # Real Frontend Benefit

  Frontend applications do NOT need to:

  - manually format fields
      
  - calculate permissions
      
  - interpret lookup display values
      
  - understand Salesforce formatting deeply
      

  UI API already returns:

  ``` text
  display-ready frontend data

   ```

  ---

  # Enterprise Use Cases

  - Lightning record pages
      
  - LWC
      
  - React/Vue frontends
      
  - dynamic forms
      
  - metadata-driven UI systems
      
  - frontend rendering engines
      

  ---

  # Architectural Difference

  sObjects API:

  ``` text
  database-centric

   ```

  UI API Records:

  ``` text
  frontend-centric

   ```

  ---

  # Real Importance

  UI API Records is part of Salesforce’s:

  ``` text
  frontend backend architecture

   ```

  used heavily by:

  - Lightning Experience
      
  - LWC
      
  - Dynamic Forms
      
  - modern Salesforce UI systems
