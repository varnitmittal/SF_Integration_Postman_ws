$kind: http-example
description: |-
  # Salesforce REST API — UI API Record UI

  UI API Record UI provides:

  - record data
      
  - layouts
      
  - field metadata
      
  - permissions
      
  - UI behavior
      

  in a single frontend-ready response.

  Endpoint:

  ``` http
  GET /services/data/v64.0/ui-api/record-ui/{RecordId}

   ```

  Example:

  ``` http
  GET /services/data/v64.0/ui-api/record-ui/a1hgK000002LFR7QAO?layoutTypes=Full&modes=View

   ```

  ---

  # Purpose

  - support Lightning Experience
      
  - support LWC
      
  - provide layout-aware UI data
      
  - support dynamic forms
      
  - provide frontend page metadata
      

  ---

  # Postman Request

  Method:

  ``` http
  GET

   ```

  URL:

  ``` http
  {{RootUrl}}/services/data/v64.0/ui-api/record-ui/a1hgK000002LFR7QAO?layoutTypes=Full&modes=View

   ```

  Headers:

  ``` http
  Authorization: Bearer ACCESS_TOKEN

   ```

  ---

  # Important Query Parameters

  ## layoutTypes

  Examples:

  ``` text
  Compact
  Full

   ```

  Controls:

  ``` text
  which layout metadata is returned

   ```

  ---

  # modes

  Examples:

  ``` text
  View
  Edit
  Create

   ```

  Controls:

  ``` text
  UI behavior mode

   ```

  Example:

  - editable fields
      
  - required fields
      
  - create/edit layouts
      

  ---

  # What It Returns

  - record data
      
  - layout sections
      
  - fields
      
  - field metadata
      
  - actions
      
  - editable fields
      
  - required fields
      
  - display values
      

  Essentially:

  ``` text
  complete page-rendering metadata

   ```

  ---

  # Important Difference

  | API | Purpose |
  | --- | --- |
  | `/ui-api/object-info/` | object metadata |
  | `/ui-api/records/` | record data |
  | `/ui-api/record-ui/` | record + layouts + UI orchestration |

  ---

  # Important Concept

  Record UI is:

  ``` text
  layout-aware

   ```

  It understands:

  - page layouts
      
  - sections
      
  - field placement
      
  - UI modes
      
  - permissions
      

  ---

  # User Context Awareness

  Response depends on:

  - profile
      
  - permission sets
      
  - field-level security
      
  - current user access
      

  Different users can receive different UI metadata.

  ---

  # Real Frontend Benefit

  Frontend applications do NOT need to:

  - manually build layouts
      
  - calculate editable fields
      
  - determine required fields
      
  - understand Salesforce UI rules
      

  Salesforce already computes:

  ``` text
  how page should render for current user

   ```

  ---

  # Enterprise Use Cases

  - Lightning record pages
      
  - LWC
      
  - dynamic forms
      
  - metadata-driven UIs
      
  - frontend generators
      
  - custom Salesforce frontends
      

  ---

  # Architectural Importance

  Record UI is effectively:

  ``` text
  frontend page-definition API

   ```

  used heavily by:

  - Lightning Experience
      
  - Dynamic Forms
      
  - modern Salesforce UI systems
      

