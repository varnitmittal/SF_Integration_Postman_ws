  # Use Describe API When

  ``` http
  /sobjects/{Object}/describe

   ```

  Choose this for:

  - integrations
      
  - middleware
      
  - backend systems
      
  - schema inspection
      
  - generic CRUD engines
      
  - ETL tools
      
  - metadata utilities
      

  Because you mainly need:

  ``` text
  object structure

   ```

  Example needs:

  - field names
      
  - data types
      
  - relationships
      
  - createable/updateable
      
  - picklists
      
  - generic API tooling
      

  ---

  # Use UI API When

  ``` http
  /ui-api/object-info/{Object}

   ```

  Choose this for:

  - frontend apps
      
  - Lightning-like UIs
      
  - dynamic forms
      
  - LWC
      
  - React/Vue frontend
      
  - metadata-driven rendering
      
  - permission-aware UX
      

  Because you need:

  ``` text
  UI behavior for CURRENT user

   ```

  Example needs:

  - editableForUpdate
      
  - visible fields
      
  - record type UI behavior
      
  - layouts
      
  - theme/icons
      
  - frontend rendering metadata
      

  ---

  # Real Decision Rule

  ## Backend/Integration Problem?

  Use:

  ``` text
  Describe API

   ```

  ---

  ## Frontend/UI Rendering Problem?

  Use:

  ``` text
  UI API

   ```

  ---

  # Examples

  | Scenario | Correct API |
  | --- | --- |
  | Build ETL tool | Describe |
  | Generic CRUD middleware | Describe |
  | Build schema explorer | Describe |
  | Build React form generator | UI API |
  | Build Lightning-like UI | UI API |
  | Dynamic frontend rendering | UI API |
  | Respect user editability in frontend | UI API |
  | Render layouts dynamically | UI API |

  ---

  # Strong Interview Answer

  Describe API:

  ``` text
  backend schema metadata

   ```

  UI API:

  ``` text
  frontend user-context metadata

   ```

  That one sentence usually signals clear architectural understanding.
