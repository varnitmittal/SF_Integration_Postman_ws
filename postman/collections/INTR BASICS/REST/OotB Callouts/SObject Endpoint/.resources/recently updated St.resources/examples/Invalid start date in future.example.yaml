description: |-
  StartFragment

  ## Get Deleted Records

  ```
  GET {{RootUrl}}/services/data/v64.0/sobjects/Student__c/deleted/?start=2026-05-17T00:00:00Z&end=2026-05-18T23:59:59Z

   ```

  Returns records deleted within the specified time range.

  ### Response Contains

  - `id` → Deleted record ID  
      
  - `deletedDate` → When record was deleted  
      
  - `earliestDateAvailable` → Oldest available deletion tracking date  
      
  - `latestDateCovered` → Latest timestamp included in response  
      

  ### Example Response

  ```
  {  "deletedRecords": [    {      "id": "a1hgK000002Lq5hQAC",      "deletedDate": "2026-05-18T13:01:31.000+0000"    }  ]}

   ```

  ### Important

  This endpoint does **NOT** return full record data or field values.

  It only provides deletion metadata because the record is already deleted.

  ### Common Use Cases

  -   
      Incremental syncs  
      
  -   
      ETL pipelines  
      
  -   
      Cache cleanup  
      
  -   
      External DB synchronization  
      
  -   
      CDC-style integrations  
      

  ### Typical Integration Flow

  ```
  1. Call /deleted2. Get deleted record IDs3. Remove matching records from external system

   ```

  ### Related Endpoint

  ```
  GET /services/data/v64.0/sobjects/Student__c/updated

   ```

  Returns IDs of records updated within a time range.

  ## Docs

  [Salesforce Get Deleted Records API](https://developer.salesforce.com/docs/atlas.en-us.api_rest.meta/api_rest/resources_getdeleted.htm?utm_source=chatgpt.com)

  EndFragment
