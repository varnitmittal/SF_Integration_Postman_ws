description: |-
  ## Describe Object Metadata

  ```
  GET {{RootUrl}}/services/data/v64.0/sobjects/Student__c/describe

   ```

  Returns complete metadata for the `Student__c` object and its fields.

  ### Learn

  - Field metadata
      
  - `createable` / `updateable` permissions
      
  - Field data types
      
  - Field lengths
      
  - Required fields (`nillable = false`)
      
  - Picklist values
      
  - Lookup relationships (`referenceTo`)
      

  ### Commonly Used Properties

  ```
  nametypelengthcreateableupdateablenillablepicklistValuesreferenceTo

   ```

  ### Why Important

  Used for:

  - Dynamic integrations
      
  - Schema discovery
      
  - Auto-validation
      
  - Dynamic form generation
      
  - Metadata-driven systems
      

  ### Best Practice

  Cache the `/describe` response instead of calling it repeatedly.

