  StartFragment

  # Step 1 — Get Your User Id

  TraceFlag needs:

  ``` text
  TracedEntityId

   ```

  usually:

  ``` text
  current User Id

   ```

  Run:

  ``` http
  GET {{RootUrl}}/services/data/v64.0/

   ```

  or easier:

  ``` http
  GET {{RootUrl}}/services/oauth2/userinfo

   ```

  Copy:

  ``` text
  user_id

   ```

  Example:

  ``` text
  005gK000000P8s3QAC

   ```

  ---

  # Step 2 — Create DebugLevel

  TraceFlag requires:

  ``` text
  DebugLevelId

   ```

  ---

  ## Method

  ``` http
  POST

   ```

  ---

  ## Endpoint

  ``` http
  {{RootUrl}}/services/data/v64.0/tooling/sobjects/DebugLevel

   ```

  ---

  ## Headers

  ``` http
  Authorization: Bearer ACCESS_TOKEN
  Content-Type: application/json

   ```

  ---

  ## Body

  ``` json
  {
    "DeveloperName": "MyDebugLevel",
    "MasterLabel": "MyDebugLevel",
    "ApexCode": "DEBUG",
    "ApexProfiling": "INFO",
    "Callout": "INFO",
    "Database": "INFO",
    "System": "DEBUG",
    "Validation": "INFO",
    "Workflow": "INFO"
  }

   ```

  ---

  # Step 3 — Copy DebugLevel Id

  Response gives:

  ``` json
  {
    "id": "7dlXXXXXXXXXXXX",
    "success": true
  }

   ```

  Copy:

  ``` text
  DebugLevel Id

   ```

  ---

  # Step 4 — Create TraceFlag

  ## Method

  ``` http
  POST

   ```

  ---

  ## Endpoint

  ``` http
  {{RootUrl}}/services/data/v64.0/tooling/sobjects/TraceFlag

   ```

  ---

  ## Headers

  ``` http
  Authorization: Bearer ACCESS_TOKEN
  Content-Type: application/json

   ```

  ---

  ## Body

  Replace:

  - `TracedEntityId`
      
  - `DebugLevelId`
      

  ``` json
  {
    "TracedEntityId": "005gK000000P8s3QAC",
    "LogType": "USER_DEBUG",
    "DebugLevelId": "7dlXXXXXXXXXXXX",
    "StartDate": "2026-05-20T10:00:00.000+0000",
    "ExpirationDate": "2026-05-20T11:00:00.000+0000"
  }

   ```

  ---

  # Step 5 — Execute Anonymous

  ``` http
  GET {{RootUrl}}/services/data/v64.0/tooling/executeAnonymous/?anonymousBody=System.debug('TraceFlag Working');

   ```

  ---

  # Step 6 — Query ApexLog

  ``` http
  GET {{RootUrl}}/services/data/v64.0/tooling/query?q=SELECT+Id,Operation,Status,StartTime+FROM+ApexLog+ORDER+BY+StartTime+DESC+LIMIT+1

   ```

  Now logs should appear successfully.

  EndFragment
